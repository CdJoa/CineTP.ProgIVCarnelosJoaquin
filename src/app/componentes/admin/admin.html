<div class="admin-layout">
  <!-- Sidebar -->
  <aside class="sidebar">
    <div class="sidebar-header">
      <h2>Panel Admin</h2>
    </div>

    <nav class="sidebar-nav">
      <a *ngIf="rolesAdminService.tieneSeccion('peliculas')" routerLink="/admin/peliculas" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }" class="nav-item">
        Administrar Películas
      </a>
      <a *ngIf="rolesAdminService.tieneSeccion('propuestas')" routerLink="/admin/propuestas" routerLinkActive="active" class="nav-item">
        💡 Propuestas de Clientes
      </a>
      <a *ngIf="rolesAdminService.tieneSeccion('funciones')" routerLink="/admin/funciones" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }" class="nav-item">
        Administrar Funciones
      </a>
      <a *ngIf="rolesAdminService.tieneSeccion('candy')" routerLink="/admin/candy" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }" class="nav-item">
        Administrar Candy Bar
      </a>
      <a *ngIf="rolesAdminService.tieneSeccion('salas')" routerLink="/admin/salas" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }" class="nav-item">
        Administrar Salas
      </a>
      <a *ngIf="rolesAdminService.tieneSeccion('cupones')" routerLink="/admin/cupones" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }" class="nav-item">
        Administrar Cupones
      </a>
      <a *ngIf="rolesAdminService.tieneSeccion('empleados')" routerLink="/admin/empleados/nuevo" routerLinkActive="active" class="nav-item">
        Registrar Empleado
      </a>
      <a *ngIf="rolesAdminService.tieneSeccion('auditoria')" routerLink="/admin/auditoria" routerLinkActive="active" class="nav-item">
        Auditoría
      </a>
      <a *ngIf="rolesAdminService.tieneSeccion('facturacion')" routerLink="/admin/facturacion" routerLinkActive="active" class="nav-item">
        📊 Facturación y Reportes
      </a>
      <a *ngIf="rolesAdminService.tieneSeccion('graficos')" routerLink="/admin/graficos" routerLinkActive="active" class="nav-item">
        📈 Gráficos de Ventas
      </a>
      <a *ngIf="authService.usuarioActual()?.rol === 'admin'" routerLink="/admin/roles" routerLinkActive="active" class="nav-item">
        🔐 Roles y permisos
      </a>
    </nav>

    <div class="sidebar-footer">
      <a routerLink="/home" class="back-link">← Volver al inicio</a>
    </div>
  </aside>

  <!-- Contenido principal -->
  <main class="admin-content">
    <router-outlet></router-outlet>
  </main>
</div>
