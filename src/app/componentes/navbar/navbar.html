<nav class="navbar">
  <div class="navbar-left">
    <a routerLink="/home" class="nav-brand">CineTP</a>
  </div>

  <div class="navbar-right">
    @if (authService.usuarioActual(); as usuario) {
      <span class="user-greeting">Hola, {{ usuario.nombre }}</span>
      <a *appEmpleado routerLink="/empleado/validar" class="nav-link nav-admin">Validar Entradas</a>
      <a *ngIf="usuario.rol === 'admin' || rolesAdminService.seccionesActuales().length > 0" routerLink="/admin" class="nav-link nav-admin">Panel Admin</a>
      @if (usuario.rol === 'cliente') {
        <div class="notificaciones-nav">
          <button type="button" class="nav-link nav-notificaciones" (click)="verNotificaciones()" aria-label="Notificaciones">
            Avisos <span *ngIf="notificacionesNoLeidas > 0" class="notificaciones-badge">{{ notificacionesNoLeidas }}</span>
          </button>
          <div *ngIf="mostrarNotificaciones()" class="notificaciones-panel">
            <strong>Notificaciones</strong>
            <p *ngIf="notificaciones().length === 0">No tienes avisos nuevos.</p>
            <button *ngFor="let n of notificaciones().slice(0, 4)" type="button" class="notificacion-item" (click)="abrirNotificaciones()">
              <span>{{ n.titulo }}</span>
              <small>{{ n.mensaje }}</small>
            </button>
            <button *ngIf="notificaciones().length > 0" type="button" class="ver-todas-notificaciones" (click)="abrirNotificaciones()">Ver avisos y opciones de reubicación</button>
          </div>
        </div>
        <a routerLink="/perfil" class="nav-link nav-perfil">Mi Perfil</a>
      }
      <button type="button" (click)="cerrarSesion()" class="nav-btn">Cerrar Sesión</button>
    } @else {
      <a routerLink="/login" class="nav-link">Iniciar Sesión</a>
      <a routerLink="/registro" class="nav-link">Registrarse</a>
    }
  </div>
</nav>
